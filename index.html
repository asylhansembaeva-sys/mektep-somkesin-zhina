<!doctype html><html lang="kk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Мектеп сөмкесін жина!</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,'Times New Roman',serif;color:#073b92;min-height:100dvh;background:#b6e5fa url('classroom.png') center center/cover fixed no-repeat}body:before{content:'';position:fixed;inset:0;background:linear-gradient(110deg,#e2f9ffdf,#fff3d7c9,#d6c0ffdb);backdrop-filter:blur(9px);pointer-events:none}.app{position:relative;max-width:1450px;margin:auto;padding:8px 12px 18px}.header{text-align:center;background:#fff9e9f2;border:5px solid #fff;border-radius:30px;box-shadow:0 5px 0 #ffc343;padding:6px}.header h1{font-size:clamp(28px,4vw,54px);margin:0;font-weight:900;color:#0646b9;text-shadow:2px 2px #fff}.header p{font-size:clamp(17px,2.3vw,29px);font-weight:900;color:#0b8b59;margin:0}.stats{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 4px;font-weight:900;font-size:clamp(16px,2vw,23px)}button{font-family:inherit}.stats button,.finish button{background:#ffdb46;border:3px solid white;border-radius:20px;padding:8px 14px;font-size:clamp(15px,1.7vw,20px);font-weight:900;cursor:pointer}.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,37%) minmax(0,1fr);gap:8px;align-items:center;min-height:550px}.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;align-items:center}.item{border:0;background:transparent;min-width:0;height:clamp(105px,10vw,150px);padding:2px;cursor:grab;touch-action:none;user-select:none;position:relative;transition:opacity .25s,transform .2s;filter:drop-shadow(0 5px 4px #273c6570)}.item img{width:100%;height:100%;object-fit:contain;pointer-events:none;mix-blend-mode:multiply}.item span{display:none}.item.selected{filter:drop-shadow(0 0 9px #ffb000) drop-shadow(0 0 5px #ffb000);transform:scale(1.08)}.item.done{opacity:0;transform:scale(.3);pointer-events:none}.item.shake{animation:shake .35s}.bag-zone{position:relative;display:flex;justify-content:center;align-items:center;min-height:410px;cursor:pointer}.bag-zone img{width:100%;max-height:520px;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;filter:drop-shadow(0 12px 10px #0003)}.bag-zone.target{filter:drop-shadow(0 0 15px #19db6d)}.message{text-align:center;font-size:clamp(17px,2.3vw,28px);font-weight:900;min-height:40px;background:#fffbe9eb;border:3px solid #fff;border-radius:25px;padding:7px;margin:8px auto;max-width:950px}.note{text-align:center;font-weight:900;font-size:clamp(15px,1.6vw,20px)}.overlay{position:fixed;inset:0;background:#123777b8;z-index:20;display:none;align-items:center;justify-content:center;padding:15px}.overlay.show{display:flex}.finish{background:#fffbea;border:7px solid #ffcb33;border-radius:35px;max-width:560px;text-align:center;padding:30px;box-shadow:0 20px 40px #0005}.finish h2{font-size:clamp(35px,5vw,58px);color:#158c42}.finish p{font-size:25px}.particle{position:fixed;z-index:30;width:10px;height:14px;pointer-events:none;animation:fall 950ms ease-out forwards}@keyframes fall{to{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(650deg)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@media(max-width:800px){body{background-attachment:scroll}.play{grid-template-columns:1fr 1fr;min-height:0}.bag-zone{grid-column:1/-1;grid-row:1;min-height:200px;max-width:350px;width:75%;justify-self:center}.bag-zone img{max-height:270px}.items{grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}.item{height:clamp(72px,19vw,115px)}.header{border-radius:18px}.stats{flex-wrap:wrap;justify-content:center}.app{padding:6px}.message{font-size:18px}}</style></head><body><main class="app"><header class="header"><h1>🎒 Мектеп сөмкесін жина!</h1><p>Мектепке қажетті заттарды таңда!</p></header><div class="stats"><span id="count">Жиналды: 0 / 10</span><button id="reset">↻ Қайтадан бастау</button></div><div class="message" id="msg" aria-live="polite">Затты басып, сөмкеге бас немесе сүйреп сал!</div><section class="play"><div class="items" id="left"></div><div class="bag-zone" id="bag" role="button" tabindex="0" aria-label="Мектеп сөмкесі"><img src="bag.png" alt="Ашық мектеп сөмкесі"></div><div class="items" id="right"></div></section><div class="note">Ойыншықтарды емес, мектеп құралдарын таңда! 🧸</div></main><div class="overlay" id="overlay"><div class="finish"><h2>🎉 Жарайсың!</h2><p>Мектеп сөмкең дайын! Барлық мектеп құралдарын жинадың!</p><button id="again">Қайтадан бастау</button></div></div><script>
const data=[{"name": "Дәптер", "img": "item00.png", "good": true}, {"name": "Кітап", "img": "item01.png", "good": true}, {"name": "Қалам", "img": "item02.png", "good": true}, {"name": "Өшіргіш", "img": "item03.png", "good": true}, {"name": "Қайшы", "img": "item04.png", "good": true}, {"name": "Қарындаш", "img": "item05.png", "good": true}, {"name": "Сызғыш", "img": "item06.png", "good": true}, {"name": "Доп", "img": "item07.png", "good": false}, {"name": "Машина", "img": "item08.png", "good": false}, {"name": "Циркуль", "img": "item09.png", "good": true}, {"name": "Джойстик", "img": "item10.png", "good": false}, {"name": "Қонжық", "img": "item11.png", "good": false}, {"name": "Қуыршақ", "img": "item12.png", "good": false}, {"name": "Юла", "img": "item13.png", "good": false}, {"name": "Кәмпит", "img": "item14.png", "good": false}, {"name": "Гүл", "img": "item15.png", "good": false}, {"name": "Банан", "img": "item16.png", "good": false}, {"name": "Пенал", "img": "item17.png", "good": true}, {"name": "Түрлі түсті қарындаштар", "img": "item18.png", "good": true}];
let order=[],round=0,done=new Set(),selected=null,locked=false,drag=null;const left=document.getElementById('left'),right=document.getElementById('right'),bag=document.getElementById('bag'),msg=document.getElementById('msg');const total=data.filter(x=>x.good).length;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sound(ok){try{let c=new (window.AudioContext||window.webkitAudioContext)();let t=c.currentTime;let notes=ok?[523,659,784]:[270,230];notes.forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.12);g.gain.exponentialRampToValueAtTime(.13,t+i*.12+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.12+.17);o.connect(g);g.connect(c.destination);o.start(t+i*.12);o.stop(t+i*.12+.19)});setTimeout(()=>c.close(),900)}catch(e){}}
function fireworks(){let rect=bag.getBoundingClientRect();let cx=rect.left+rect.width/2,cy=rect.top+rect.height*.35;for(let i=0;i<38;i++){let p=document.createElement('i');p.className='particle';p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=['#ff376a','#ffc900','#2dbaff','#48ce45','#b53aff'][i%5];p.style.setProperty('--dx',(Math.random()*420-210)+'px');p.style.setProperty('--dy',(Math.random()*320-160)+'px');document.body.append(p);setTimeout(()=>p.remove(),1000)}}
function status(s){msg.textContent=s;document.getElementById('count').textContent='Жиналды: '+done.size+' / '+total;}
function start(){order=shuffle(data.map((_,i)=>i));done=new Set();round=0;selected=null;locked=false;document.getElementById('overlay').classList.remove('show');render();status('Затты басып, сөмкеге бас немесе сүйреп сал!')}
function render(){left.innerHTML='';right.innerHTML='';selected=null;let arr=order.filter(i=>!done.has(i));arr.forEach((idx,n)=>{let item=data[idx],b=document.createElement('button');b.className='item';b.type='button';b.dataset.id=idx;b.setAttribute('aria-label',item.name);b.innerHTML='<img src="'+item.img+'" alt=""><span>'+item.name+'</span>';b.addEventListener('click',()=>{if(Date.now()-(b._dragEnd||0)<350)return;pick(idx)});b.addEventListener('pointerdown',e=>{if(locked)return;drag={id:idx,x:e.clientX,y:e.clientY,el:b,moved:false};b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!drag||drag.el!==b)return;if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.moved=true;b.style.transform='translate('+(e.clientX-drag.x)+'px,'+(e.clientY-drag.y)+'px) scale(1.08)';b.style.zIndex=10;let r=bag.getBoundingClientRect();bag.classList.toggle('target',e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom)}});b.addEventListener('pointerup',e=>{if(!drag||drag.el!==b)return;let d=drag;drag=null;b.style.transform='';b.style.zIndex='';bag.classList.remove('target');if(d.moved){b._dragEnd=Date.now();let r=bag.getBoundingClientRect();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){selected=idx;place()}}});(n%2?right:left).appendChild(b)})}
function pick(idx){if(locked||done.has(idx))return;selected=idx;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('selected',Number(x.dataset.id)===idx));status(data[idx].name+' таңдалды. Енді сөмкені бас!')}
function place(){if(locked||selected===null)return;let idx=selected,item=data[idx],b=document.querySelector('.item[data-id="'+idx+'"]');selected=null;document.querySelectorAll('.item').forEach(x=>x.classList.remove('selected'));if(!item.good){status('❌ '+item.name+' — мектеп құралы емес. Басқасын таңда!');sound(false);if(b){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450)}return}locked=true;done.add(idx);if(b)b.classList.add('done');sound(true);fireworks();status('🎉 Жарайсың! '+item.name+' сөмкеге салынды!');setTimeout(()=>{locked=false;if(done.size===total){document.getElementById('overlay').classList.add('show');fireworks();return}let current=order;render()},1100)}
bag.addEventListener('click',place);bag.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place()}});document.getElementById('reset').addEventListener('click',start);document.getElementById('again').addEventListener('click',start);start();
</script></body></html>
